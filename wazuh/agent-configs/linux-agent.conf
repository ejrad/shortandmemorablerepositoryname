<agent_config>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mail.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/maillog</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/httpd/access_log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/httpd/error_log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/vsftpd.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/xferlog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/roundcube/errors.log</location>
  </localfile>

  <syscheck>
    <frequency>300</frequency>
    <alert_new_files>yes</alert_new_files>
    <directories realtime="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group</directories>
    <directories realtime="yes" check_all="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/ssh/sshd_config,/root/.ssh,/home</directories>
    <directories realtime="yes" check_all="yes">/etc/ld.so.preload,/etc/pam.d,/etc/profile.d</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system,/etc/cron.d,/etc/crontab</directories>
    <directories realtime="yes" check_all="yes">/etc/postfix,/etc/dovecot,/etc/exim4,/etc/mysql,/etc/postgresql</directories>
    <directories realtime="yes" check_all="yes">/etc/aliases,/var/vmail</directories>
    <directories realtime="yes" check_all="yes">/etc/nginx,/etc/apache2,/etc/httpd</directories>
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>
    <directories realtime="yes" check_all="yes">/var/www,/usr/share/nginx,/usr/share/httpd</directories>
  </syscheck>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>3m</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
    <services>yes</services>
    <browser_extensions>yes</browser_extensions>
  </wodle>

</agent_config>
